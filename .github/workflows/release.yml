name: Release

# Tag a commit on main (`m1`, `m3`, `demo`, ...) to publish a GitHub Release with
# a flashable firmware image per PlatformIO environment and an Android APK.
on:
  push:
    tags: ["m*", "demo*"]

permissions:
  contents: write

env:
  # Keep in sync with ci.yml.
  PLATFORMIO_VERSION: "6.2.0"
  ESPTOOL_VERSION: "5.6.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tag on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - id: project
        name: Detect projects
        run: |
          [ -f firmware/platformio.ini ] && echo "firmware=true" >> "$GITHUB_OUTPUT" || echo "firmware=false" >> "$GITHUB_OUTPUT"
          [ -f app/pubspec.yaml ] && echo "app=true" >> "$GITHUB_OUTPUT" || echo "app=false" >> "$GITHUB_OUTPUT"
          mkdir -p dist

      # --- firmware ---------------------------------------------------------

      - if: steps.project.outputs.firmware == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - if: steps.project.outputs.firmware == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-

      - if: steps.project.outputs.firmware == 'true'
        name: Build firmware
        working-directory: firmware
        run: |
          pip install "platformio==${PLATFORMIO_VERSION}" "esptool==${ESPTOOL_VERSION}"
          pio run

      # One image per environment, flashed at 0x0 (esptool or a web flasher).
      # Offsets are the ESP32 Arduino defaults: bootloader 0x1000, partition
      # table 0x8000, boot_app0 0xe000, application 0x10000.
      - if: steps.project.outputs.firmware == 'true'
        name: Merge firmware images
        run: |
          boot_app0=$(find ~/.platformio/packages -path '*framework-arduinoespressif32*/tools/partitions/boot_app0.bin' | head -n 1)
          if [ -z "$boot_app0" ]; then
            echo "::error::boot_app0.bin not found in PlatformIO packages"
            exit 1
          fi
          for build in firmware/.pio/build/*/; do
            [ -f "$build/firmware.bin" ] || continue
            env_name=$(basename "$build")
            esptool --chip esp32 merge-bin \
              -o "dist/social-paradox-${GITHUB_REF_NAME}-${env_name}.bin" \
              0x1000 "$build/bootloader.bin" \
              0x8000 "$build/partitions.bin" \
              0xe000 "$boot_app0" \
              0x10000 "$build/firmware.bin"
          done

      # --- app --------------------------------------------------------------

      - if: steps.project.outputs.app == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - if: steps.project.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - if: steps.project.outputs.app == 'true'
        name: Build Android APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/social-paradox-${GITHUB_REF_NAME}.apk"

      # --- publish ----------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::nothing to release (no firmware or app build output)"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
